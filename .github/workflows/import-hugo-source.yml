name: Import HUGO source bundle

on:
  push:
    branches: [main]
    paths:
      - 'imports/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and import HUGO Clip 0.2 source
        shell: bash
        run: |
          set -euo pipefail
          cat imports/hugo-clip-0.2-ready.b64.* | base64 --decode > /tmp/hugo-clip-0.2-ready.zip
          unzip -tq /tmp/hugo-clip-0.2-ready.zip

          rm -rf app gradle
          rm -f build.gradle.kts settings.gradle.kts gradle.properties README.md metadata.json .gitignore
          unzip -oq /tmp/hugo-clip-0.2-ready.zip -d .
          rm -rf imports

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import HUGO Clip 0.2 architecture'
          git push origin HEAD:main
