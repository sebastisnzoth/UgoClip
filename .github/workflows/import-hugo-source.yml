name: Import HUGO source bundle

on:
  push:
    branches: [main]
    paths:
      - 'imports/hugo-clip-0.2-source.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import corrected Android project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='imports/hugo-clip-0.2-source.zip'
          if [ ! -f "$ARCHIVE" ]; then
            echo 'Source archive already consumed; nothing to do.'
            exit 0
          fi

          rm -rf app gradle
          rm -f build.gradle.kts settings.gradle.kts gradle.properties README.md .gitignore
          unzip -oq "$ARCHIVE" -d .
          rm -f "$ARCHIVE"
          rmdir imports 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes detected.'
            exit 0
          fi
          git commit -m 'feat: import HUGO Clip 0.2 architecture'
          git push origin HEAD:main
